<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of an AmBank card above a rising growth chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#008F95"/><stop offset="1" stop-color="#00CFC8"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6FAF9"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#00474b" flood-opacity=".35"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="640" cy="170" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"><circle cx="640" cy="170" r="120"/><circle cx="640" cy="170" r="210"/><circle cx="640" cy="170" r="300"/></g>
  <g fill="#fff" fill-opacity=".1">
    <rect x="0" y="700" width="90" height="300"/><rect x="100" y="640" width="70" height="360"/><rect x="180" y="720" width="110" height="280"/>
    <rect x="300" y="610" width="80" height="390"/><rect x="390" y="690" width="100" height="310"/><rect x="500" y="650" width="75" height="350"/>
    <rect x="585" y="730" width="105" height="270"/><rect x="700" y="670" width="100" height="330"/>
  </g>
  <path d="M60 430 L190 360 L300 395 L430 290 L560 320 L720 190 L720 520 L60 520 Z" fill="url(#area)"/>
  <polyline points="60,430 190,360 300,395 430,290 560,320 720,190" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff"><circle cx="190" cy="360" r="9"/><circle cx="430" cy="290" r="9"/><circle cx="720" cy="190" r="12"/></g>
  <g transform="rotate(8 430 560)"><rect x="210" y="400" width="420" height="260" rx="28" fill="#fff" fill-opacity=".28"/></g>
  <g transform="rotate(-7 400 520)" filter="url(#shadow)">
    <rect x="170" y="370" width="460" height="280" rx="30" fill="url(#card)"/>
    <text x="210" y="435" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="38" font-weight="800" fill="#008F95">AmBank</text>
    <rect x="210" y="480" width="64" height="48" rx="10" fill="#E6FAF9" stroke="#00CFC8" stroke-width="3"/>
    <path d="M210 504 H274 M242 480 V528" stroke="#00CFC8" stroke-width="2.5"/>
    <text x="210" y="590" font-family="Arial, sans-serif" font-size="28" letter-spacing="5" fill="#172B35">•••• •••• •••• 2048</text>
    <text x="210" y="625" font-family="Arial, sans-serif" font-size="16" fill="#71838B">AMERICAN BANK</text>
    <circle cx="560" cy="440" r="26" fill="#00CFC8" fill-opacity=".9"/><circle cx="584" cy="440" r="26" fill="#008F95" fill-opacity=".8"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="130" cy="560" r="34" fill="#fff" fill-opacity=".9"/><text x="130" y="573" font-size="36" fill="#008F95">$</text>
    <circle cx="690" cy="610" r="26" fill="#fff" fill-opacity=".75"/><text x="690" y="620" font-size="28" fill="#008F95">$</text>
    <circle cx="110" cy="250" r="20" fill="#fff" fill-opacity=".55"/><text x="110" y="258" font-size="22" fill="#008F95">$</text>
  </g>
</svg>
