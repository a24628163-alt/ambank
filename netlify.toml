[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Security scan bypass for your public Supabase keys
  SECRETS_SCAN_ENABLED = "false"

# Redirect root to login
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302

# 1. Map the secret URL to the admin page internally
[[redirects]]
  from = "/secret-admin-portal"
  to = "/admin.html"
  status = 200

# 2. Block direct access to admin.html (redirects to login)
[[redirects]]
  from = "/admin.html"
  to = "/login.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"